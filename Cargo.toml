[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eimantaskat/thermite"

[workspace.dependencies]
thermite-core = { path = "crates/thermite-core" }
thermite-macros = { path = "crates/thermite-macros" }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bytes = "1.12.1"
# async_tokio for awaiting in benchmarks; plotters and rayon only draw charts and analyse in parallel
criterion = { version = "0.8.2", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
http = "1.5.0"
# gzip for GZipMiddleware, on the pure-Rust miniz_oxide backend
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend", "runtime_detection"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
http-body-util = "0.1.5"
# parses multipart/form-data, as axum does
multer = { version = "3.1.0", default-features = false }
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
proc-macro2 = "1.0.107"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
quote = "1.0.47"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std", "preserve_order"] }
syn = { version = "3.0.9", default-features = false, features = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
trybuild = "1.0.122"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"
# turned back on with missing_docs in the doc comment pass
missing_errors_doc = "allow"
missing_panics_doc = "allow"
