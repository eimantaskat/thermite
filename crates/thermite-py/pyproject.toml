[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "thermite-web"
requires-python = ">=3.11"
dynamic = ["version"]

[dependency-groups]
dev = [
    "maturin>=1.16,<2",
    "mypy>=2.4.1",
    "pytest>=9",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.maturin]
python-source = "python"
module-name = "thermite._thermite"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# uv does not see Rust changes on its own, so the module would go stale
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../thermite-core/src/**/*.rs" },
    { file = "../../Cargo.lock" },
]

[tool.ruff]
line-length = 88
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "python"
python_version = "3.11"
files = ["python"]

[tool.coverage.run]
source_pkgs = ["thermite"]
# workers run in spawned processes, and each writes its own data file
concurrency = ["multiprocessing", "thread"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
