[package]
name = "thermite-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
flate2.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
multer.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
proptest.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "test-util"] }

[[bench]]
name = "core"
harness = false

# a binary of its own, so the other benchmarks run with no tracing subscriber registered
[[bench]]
name = "access_log"
harness = false

[lints]
workspace = true
